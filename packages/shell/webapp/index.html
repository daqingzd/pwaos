<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PwaOS Shell</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #1e1e1d;
    overflow: hidden;
  }
  #terminal-host {
    position: absolute;
    inset: 0;
    padding: 6px 8px;
    box-sizing: border-box;
  }
  #terminal-host .xterm {
    height: 100%;
  }
  .xterm-viewport.xterm-viewport { scrollbar-width: thin; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-track { opacity: 0; }
  .xterm-viewport::-webkit-scrollbar-thumb {
    min-height: 20px;
    background-color: #ffffff20;
  }
</style>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script src="xterm-addon-webgl.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="terminal-host"></div>
</body>
</html>
